[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventmem"
version = "0.2.0"
description = "An event-driven shared memory runtime for collaborative AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Mamlesh VA", email = "mamlesh.va06@gmail.com" }]
keywords = [
    "multi-agent", "llm", "memory", "event-driven", "publish-subscribe",
    "agent-coordination", "shared-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The core runtime has no required dependencies. That is deliberate: the
# in-memory transport, the hashing embedder and the mock model mean `pip
# install eventmem` gives you something that runs and can be tested, with no
# keys, no services and no model downloads.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
openai = ["openai>=1.40", "python-dotenv>=1.0"]
local = ["sentence-transformers>=2.2"]
bench = ["tabulate>=0.9"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "redis>=5.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "sentence-transformers>=2.2",
]

[project.urls]
Homepage = "https://github.com/Mamlesh18/EventMem"
Repository = "https://github.com/Mamlesh18/EventMem"
Issues = "https://github.com/Mamlesh18/EventMem/issues"

[project.scripts]
eventmem-bench = "benchmarks.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eventmem", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::RuntimeWarning",
    # The runtime deliberately warns when a semantic subscription meets a
    # non-semantic embedder. Tests that exercise that path opt in explicitly.
    "default::DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py39"
src = ["src", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in defaults are used intentionally for factories
    "SIM108", # ternaries are not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
# The plugin seams are intentionally duck-typed via Protocol, so strict mode
# would fight the design rather than find bugs.
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/eventmem"]
branch = true
