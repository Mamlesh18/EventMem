# Redis for EventMem. Start it with:  docker compose up -d
# It exposes the default port, which matches the REDIS_URL default in config.py.
services:
  redis:
    image: redis:7-alpine
    container_name: eventmem-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - eventmem-redis-data:/data

volumes:
  eventmem-redis-data:
