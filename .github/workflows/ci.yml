name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately: its wall clock has 15.6ms
        # granularity, which is what forced the hybrid clock in core/clock.py.
        # A timing regression there only shows up on Windows.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src benchmarks tests

      # No keys, no Redis, no model downloads. If this needs a service, the
      # zero-dependency promise has been broken.
      - name: Test
        run: pytest -q

      - name: Examples still run
        run: |
          python examples/01_quickstart.py
          python examples/02_swap_the_ideology.py

      - name: Benchmarks still run
        run: python -m benchmarks.run --workload noisy_broadcast
